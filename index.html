<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bangladesh Emergency Alert</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #006a4e, #004d3a);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: #fff;
      color: #222;
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
      text-align: center;
    }

    .flag {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 5px 0 10px;
      color: #006a4e;
      font-size: 25px;
    }

    p {
      color: #555;
      line-height: 1.5;
    }

    select {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: #fff;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #006a4e;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00563f;
    }

    .home {
      display: none;
    }

    .district {
      color: #006a4e;
      font-weight: bold;
      font-size: 20px;
    }

    .change {
      background: #eee;
      color: #333;
      font-size: 14px;
    }

    #notificationStatus {
      margin-top: 20px;
      padding: 12px;
      border-radius: 10px;
      background: #f1f1f1;
      color: #333;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- FIRST TIME SETUP -->
  <div id="setup">

    <div class="flag">🇧🇩</div>

    <h1>Bangladesh Emergency Alert</h1>

    <p>
      জরুরি সতর্কতা পেতে প্রথমে আপনার জেলা নির্বাচন করুন।
    </p>

    <select id="district">
      <option value="">-- আপনার জেলা নির্বাচন করুন --</option>
    </select>

    <button onclick="saveDistrict()">
      CONTINUE
    </button>

  </div>


  <!-- HOME -->
  <div id="home">

    <div class="flag">🇧🇩</div>

    <h1>Bangladesh Emergency Alert</h1>

    <p>
      আপনার নির্বাচিত জেলা:
    </p>

    <div class="district" id="selectedDistrict"></div>

    <div id="notificationStatus">
      Notification status checking...
    </div>

    <button class="change" onclick="changeDistrict()">
      জেলা পরিবর্তন করুন
    </button>

  </div>

</div>


<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>


<script>

  const firebaseConfig = {

    apiKey: "AIzaSyCr95lLjLgbeLHGnaHXV8pO45GwHOU0HIo",

    authDomain:
      "bangladesh-emergency-ale-b20aa.firebaseapp.com",

    projectId:
      "bangladesh-emergency-ale-b20aa",

    storageBucket:
      "bangladesh-emergency-ale-b20aa.firebasestorage.app",

    messagingSenderId:
      "409539260860",

    appId:
      "1:409539260860:web:d4043fe16a1061d9953bb9"

  };


  // Initialize Firebase
  firebase.initializeApp(firebaseConfig);

  const messaging = firebase.messaging();


  // বাংলাদেশের ৬৪ জেলা
  const districts = [

    "ঢাকা",
    "ফরিদপুর",
    "গাজীপুর",
    "গোপালগঞ্জ",
    "কিশোরগঞ্জ",
    "মাদারীপুর",
    "মানিকগঞ্জ",
    "মুন্সিগঞ্জ",
    "নারায়ণগঞ্জ",
    "নরসিংদী",
    "রাজবাড়ী",
    "শরীয়তপুর",
    "টাঙ্গাইল",

    "বাগেরহাট",
    "চুয়াডাঙ্গা",
    "যশোর",
    "ঝিনাইদহ",
    "খুলনা",
    "কুষ্টিয়া",
    "মাগুরা",
    "মেহেরপুর",
    "নড়াইল",
    "সাতক্ষীরা",

    "বান্দরবান",
    "ব্রাহ্মণবাড়িয়া",
    "চাঁদপুর",
    "চট্টগ্রাম",
    "কুমিল্লা",
    "কক্সবাজার",
    "ফেনী",
    "খাগড়াছড়ি",
    "লক্ষ্মীপুর",
    "নোয়াখালী",
    "রাঙ্গামাটি",

    "বগুড়া",
    "জয়পুরহাট",
    "নওগাঁ",
    "নাটোর",
    "চাঁপাইনবাবগঞ্জ",
    "পাবনা",
    "রাজশাহী",

    "দিনাজপুর",

    "নীলফামারী",
    "পঞ্চগড়",
    "রংপুর",
    "ঠাকুরগাঁও",

    "জামালপুর",
    "ময়মনসিংহ",
    "নেত্রকোনা",
    "শেরপুর",

    "বরগুনা",
    "বরিশাল",
    "ভোলা",
    "ঝালকাঠি",
    "পটুয়াখালী",
    "পিরোজপুর",

    "হবিগঞ্জ",
    "মৌলভীবাজার",
    "সুনামগঞ্জ",
    "সিলেট"

  ];


  // District dropdown
  const select = document.getElementById("district");

  districts.forEach(function(district) {

    const option = document.createElement("option");

    option.value = district;

    option.textContent = district;

    select.appendChild(option);

  });


  // Save district
  async function saveDistrict() {

    const district = select.value;

    if (!district) {

      alert("অনুগ্রহ করে আপনার জেলা নির্বাচন করুন।");

      return;

    }

    localStorage.setItem(
      "userDistrict",
      district
    );

    showHome(district);

    // Notification permission
    await enableNotifications();

  }


  // Show home
  function showHome(district) {

    document.getElementById("setup").style.display =
      "none";

    document.getElementById("home").style.display =
      "block";

    document.getElementById("selectedDistrict").textContent =
      district;

  }


  // Change district
  function changeDistrict() {

    localStorage.removeItem("userDistrict");

    document.getElementById("home").style.display =
      "none";

    document.getElementById("setup").style.display =
      "block";

    select.value = "";

  }


  // Enable notification
  async function enableNotifications() {

    const status =
      document.getElementById("notificationStatus");


    // Browser support check
    if (!("Notification" in window)) {

      status.textContent =
        "এই browser notification support করে না।";

      return;

    }


    try {

      const permission =
        await Notification.requestPermission();


      if (permission !== "granted") {

        status.textContent =
          "🔕 Notification permission দেওয়া হয়নি।";

        return;

      }


      status.textContent =
        "🔔 Notification permission দেওয়া হয়েছে। Token তৈরি হচ্ছে...";


      // VAPID public key
      const token = await messaging.getToken({

        vapidKey:
          "BNfljoumaCPfQGwiLlIk-ofzt4085KxjQNfftw-j7z4pad7a-ZUt7cS_zBdBL51H0LtEL3NpvBVUU8LcmnabW_c"

      });


      if (token) {

        console.log(
          "FCM TOKEN:",
          token
        );

        // Temporary local save
        localStorage.setItem(
          "fcmToken",
          token
        );

        status.textContent =
          "🔔 Notification প্রস্তুত আছে।";

      } else {

        status.textContent =
          "FCM token পাওয়া যায়নি।";

      }

    }

    catch (error) {

      console.error(
        "Notification error:",
        error
      );

      status.textContent =
        "Notification setup করতে সমস্যা হয়েছে।";

    }

  }


  // Page load
  window.onload = function() {

    const savedDistrict =
      localStorage.getItem("userDistrict");


    if (savedDistrict) {

      showHome(savedDistrict);

    }

  };

</script>

</body>
</html>
