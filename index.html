<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#006a4e"
  >

  <meta
    name="description"
    content="বাংলাদেশের ৬৪ জেলার জরুরি সতর্কতা ব্যবস্থা"
  >

  <title>Bangladesh Emergency Alert</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family:
        Arial,
        "Noto Sans Bengali",
        "Noto Sans",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #006a4e,
          #003f2f
        );

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 18px;

      color: #222;
    }

    .container {
      width: 100%;
      max-width: 460px;

      background: white;

      border-radius: 24px;

      padding: 28px 22px;

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.28);
    }

    .screen {
      text-align: center;
    }

    .flag {
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;

      color: #006a4e;

      font-size: 25px;
    }

    .subtitle {
      color: #555;

      line-height: 1.6;

      margin:
        12px
        0
        22px;
    }

    select {
      width: 100%;

      padding: 15px;

      border:
        2px solid
        #ddd;

      border-radius: 12px;

      font-size: 16px;

      background: white;

      outline: none;
    }

    select:focus {
      border-color: #006a4e;
    }

    button {
      width: 100%;

      padding: 15px;

      margin-top: 15px;

      border: 0;

      border-radius: 12px;

      background: #006a4e;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #00533d;
    }

    button:disabled {
      opacity: 0.55;

      cursor: not-allowed;
    }

    .secondary {
      background: #eeeeee;

      color: #333;
    }

    .secondary:hover {
      background: #dddddd;
    }

    #home {
      display: none;
    }

    .district-name {
      font-size: 27px;

      color: #006a4e;

      font-weight: bold;

      margin:
        8px
        0
        20px;
    }

    .status {
      text-align: left;

      padding: 14px;

      border-radius: 12px;

      background: #f1f3f2;

      font-size: 14px;

      line-height: 1.6;

      margin-top: 15px;
    }

    .success {
      background: #e5f7ed;

      color: #12643e;
    }

    .warning {
      background: #fff5d8;

      color: #725600;
    }

    .error {
      background: #ffe7e7;

      color: #9b1717;
    }

    .alert {
      display: none;

      margin-top: 20px;

      padding: 17px;

      text-align: left;

      background: #fff2f2;

      border-left:
        5px solid
        #d90429;

      border-radius: 12px;
    }

    .alert h3 {
      margin:
        0
        0
        8px;

      color: #b00020;
    }

    .alert p {
      margin: 0;

      line-height: 1.6;

      white-space: pre-wrap;
    }

    .small {
      text-align: center;

      color: #888;

      font-size: 12px;

      margin-top: 20px;
    }

    .loader {
      text-align: center;

      padding: 15px;

      color: #555;
    }

  </style>

</head>


<body>

  <div class="container">


    <!-- ==============================
         FIRST SCREEN
         ============================== -->

    <div
      id="setup"
      class="screen"
    >

      <div class="flag">
        🇧🇩
      </div>

      <h1>
        Bangladesh Emergency Alert
      </h1>

      <p class="subtitle">
        জরুরি সতর্কতা পেতে প্রথমে
        আপনার জেলা নির্বাচন করুন।
      </p>


      <select id="districtSelect">

        <option value="">
          -- আপনার জেলা নির্বাচন করুন --
        </option>

      </select>


      <button
        id="continueButton"
        onclick="continueSetup()"
      >
        CONTINUE
      </button>

    </div>



    <!-- ==============================
         HOME SCREEN
         ============================== -->

    <div
      id="home"
      class="screen"
    >

      <div class="flag">
        🇧🇩
      </div>

      <h1>
        Bangladesh Emergency Alert
      </h1>

      <p>
        আপনার নির্বাচিত জেলা:
      </p>

      <div
        id="selectedDistrict"
        class="district-name"
      >
      </div>


      <div
        id="status"
        class="status"
      >
        প্রস্তুত হচ্ছে...
      </div>


      <!-- Emergency alert appears here -->

      <div
        id="alertBox"
        class="alert"
      >

        <h3 id="alertTitle">
          জরুরি সতর্কতা
        </h3>

        <p id="alertMessage">
        </p>

      </div>


      <button
        class="secondary"
        onclick="changeDistrict()"
      >
        জেলা পরিবর্তন করুন
      </button>


      <div class="small">
        Bangladesh Emergency Alert
      </div>

    </div>

  </div>



  <!-- ==========================================
       FIREBASE
       ========================================== -->

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js">
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js">
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js">
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js">
  </script>



  <script>

    /*
    =====================================================
    FIREBASE CONFIG
    =====================================================
    */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCr95lLjLgbeLHGnaHXV8pO45GwHOU0HIo",

      authDomain:
        "bangladesh-emergency-ale-b20aa.firebaseapp.com",

      projectId:
        "bangladesh-emergency-ale-b20aa",

      storageBucket:
        "bangladesh-emergency-ale-b20aa.firebasestorage.app",

      messagingSenderId:
        "409539260860",

      appId:
        "1:409539260860:web:d4043fe16a1061d9953bb9",

      measurementId:
        "G-MN3PMPLZXY"

    };


    /*
    =====================================================
    INITIALIZE FIREBASE
    =====================================================
    */

    firebase.initializeApp(
      firebaseConfig
    );


    const auth =
      firebase.auth();


    const db =
      firebase.firestore();


    const messaging =
      firebase.messaging();



    /*
    =====================================================
    VAPID PUBLIC KEY
    =====================================================
    */

    const VAPID_KEY =
      "BNfljoumaCPfQGwiLlIk-ofzt4085KxjQNfftw-j7z4pad7a-ZUt7cS_zBdBL51H0LtEL3NpvBVUU8LcmnabW_c";



    /*
    =====================================================
    BANGLADESH 64 DISTRICTS
    =====================================================
    */

    const districts = [

      "ঢাকা",
      "ফরিদপুর",
      "গাজীপুর",
      "গোপালগঞ্জ",
      "কিশোরগঞ্জ",
      "মাদারীপুর",
      "মানিকগঞ্জ",
      "মুন্সিগঞ্জ",
      "নারায়ণগঞ্জ",
      "নরসিংদী",
      "রাজবাড়ী",
      "শরীয়তপুর",
      "টাঙ্গাইল",

      "বাগেরহাট",
      "চুয়াডাঙ্গা",
      "যশোর",
      "ঝিনাইদহ",
      "খুলনা",
      "কুষ্টিয়া",
      "মাগুরা",
      "মেহেরপুর",
      "নড়াইল",
      "সাতক্ষীরা",

      "বান্দরবান",
      "ব্রাহ্মণবাড়িয়া",
      "চাঁদপুর",
      "চট্টগ্রাম",
      "কুমিল্লা",
      "কক্সবাজার",
      "ফেনী",
      "খাগড়াছড়ি",
      "লক্ষ্মীপুর",
      "নোয়াখালী",
      "রাঙ্গামাটি",

      "বগুড়া",
      "জয়পুরহাট",
      "নওগাঁ",
      "নাটোর",
      "চাঁপাইনবাবগঞ্জ",
      "পাবনা",
      "রাজশাহী",
      "সিরাজগঞ্জ",

      "দিনাজপুর",
      "গাইবান্ধা",
      "কুড়িগ্রাম",
      "লালমনিরহাট",
      "নীলফামারী",
      "পঞ্চগড়",
      "রংপুর",
      "ঠাকুরগাঁও",

      "জামালপুর",
      "ময়মনসিংহ",
      "নেত্রকোনা",
      "শেরপুর",

      "বরগুনা",
      "বরিশাল",
      "ভোলা",
      "ঝালকাঠি",
      "পটুয়াখালী",
      "পিরোজপুর",

      "হবিগঞ্জ",
      "মৌলভীবাজার",
      "সুনামগঞ্জ",
      "সিলেট"

    ];



    /*
    =====================================================
    ADD DISTRICTS TO SELECT
    =====================================================
    */

    const districtSelect =
      document.getElementById(
        "districtSelect"
      );


    districts.forEach(
      district => {

        const option =
          document.createElement(
            "option"
          );

        option.value =
          district;

        option.textContent =
          district;

        districtSelect.appendChild(
          option
        );

      }
    );



    /*
    =====================================================
    SERVICE WORKER
    =====================================================
    */

    async function registerServiceWorker() {

      if (
        !("serviceWorker" in navigator)
      ) {

        throw new Error(
          "এই browser Service Worker support করে না।"
        );

      }


      const registration =
        await navigator.serviceWorker.register(
          "/bangladesh-emergency-alert/firebase-messaging-sw.js"
        );


      await navigator.serviceWorker.ready;


      return registration;

    }



    /*
    =====================================================
    FIREBASE ANONYMOUS LOGIN
    =====================================================
    */

    async function loginAnonymously() {

      if (auth.currentUser) {

        return auth.currentUser;

      }


      const result =
        await auth.signInAnonymously();


      return result.user;

    }



    /*
    =====================================================
    SAVE USER TO FIRESTORE
    =====================================================
    */

    async function saveUserToFirestore(
      user,
      district,
      token
    ) {

      await db
        .collection("users")
        .doc(user.uid)
        .set({

          district:
            district,

          fcmToken:
            token,

          updatedAt:
            firebase.firestore.FieldValue.serverTimestamp(),

          platform:
            navigator.platform || "unknown",

          userAgent:
            navigator.userAgent.substring(
              0,
              500
            )

        }, {

          merge: true

        });

    }



    /*
    =====================================================
    COMPLETE NOTIFICATION SETUP
    =====================================================
    */

    async function setupNotifications(
      district
    ) {

      const status =
        document.getElementById(
          "status"
        );


      status.className =
        "status";


      status.innerHTML =
        "⏳ Notification setup হচ্ছে...";


      /*
      ----------------------------------------------
      Check browser support
      ----------------------------------------------
      */

      if (
        !("Notification" in window)
      ) {

        throw new Error(
          "এই browser notification support করে না।"
        );

      }


      /*
      ----------------------------------------------
      HTTPS
      ----------------------------------------------
      */

      if (
        location.protocol !== "https:" &&
        location.hostname !== "localhost"
      ) {

        throw new Error(
          "Notification-এর জন্য HTTPS প্রয়োজন।"
        );

      }


      /*
      ----------------------------------------------
      Firebase anonymous login
      ----------------------------------------------
      */

      const user =
        await loginAnonymously();


      console.log(
        "Firebase Anonymous UID:",
        user.uid
      );


      /*
      ----------------------------------------------
      Notification permission
      ----------------------------------------------
      */

      let permission =
        Notification.permission;


      if (
        permission !== "granted"
      ) {

        permission =
          await Notification.requestPermission();

      }


      if (
        permission !== "granted"
      ) {

        status.className =
          "status warning";

        status.innerHTML =
          "🔕 Notification permission দেওয়া হয়নি।<br>" +
          "Browser-এর Site Settings থেকে Notifications → Allow করুন।";

        return;

      }


      /*
      ----------------------------------------------
      Service Worker
      ----------------------------------------------
      */

      const registration =
        await registerServiceWorker();


      /*
      ----------------------------------------------
      Get FCM token
      ----------------------------------------------
      */

      const token =
        await messaging.getToken({

          vapidKey:
            VAPID_KEY,

          serviceWorkerRegistration:
            registration

        });


      if (!token) {

        throw new Error(
          "FCM token পাওয়া যায়নি।"
        );

      }


      console.log(
        "FCM token:",
        token
      );


      /*
      ----------------------------------------------
      Save user + district + token
      ----------------------------------------------
      */

      await saveUserToFirestore(
        user,
        district,
        token
      );


      /*
      ----------------------------------------------
      Save locally too
      ----------------------------------------------
      */

      localStorage.setItem(
        "userDistrict",
        district
      );


      localStorage.setItem(
        "fcmToken",
        token
      );


      /*
      ----------------------------------------------
      Success
      ----------------------------------------------
      */

      status.className =
        "status success";

      status.innerHTML =
        "🔔 <strong>Notification প্রস্তুত আছে।</strong><br>" +
        "আপনার জেলার জরুরি সতর্কতা পাওয়ার জন্য এই device registered হয়েছে।";


      console.log(
        "Registration complete."
      );

    }



    /*
    =====================================================
    CONTINUE BUTTON
    =====================================================
    */

    async function continueSetup() {

      const district =
        districtSelect.value;


      if (!district) {

        alert(
          "অনুগ্রহ করে আপনার জেলা নির্বাচন করুন।"
        );

        return;

      }


      const button =
        document.getElementById(
          "continueButton"
        );


      button.disabled =
        true;


      button.textContent =
        "Please wait...";


      document.getElementById(
        "setup"
      ).style.display =
        "none";


      document.getElementById(
        "home"
      ).style.display =
        "block";


      document.getElementById(
        "selectedDistrict"
      ).textContent =
        district;


      try {

        await setupNotifications(
          district
        );

      }

      catch (error) {

        console.error(
          "SETUP ERROR:",
          error
        );


        const status =
          document.getElementById(
            "status"
          );


        status.className =
          "status error";


        status.innerHTML =
          "❌ Notification setup করতে সমস্যা হয়েছে।<br><br>" +
          "<strong>Error:</strong><br>" +
          escapeHtml(
            error.message ||
            "Unknown error"
          );

      }

      finally {

        button.disabled =
          false;

        button.textContent =
          "CONTINUE";

      }

    }



    /*
    =====================================================
    FOREGROUND MESSAGE
    =====================================================
    */

    messaging.onMessage(
      payload => {

        console.log(
          "Foreground notification:",
          payload
        );


        const title =
          payload.notification?.title ||
          payload.data?.title ||
          "🚨 Bangladesh Emergency Alert";


        const message =
          payload.notification?.body ||
          payload.data?.body ||
          "আপনার জেলার জন্য নতুন জরুরি সতর্কতা এসেছে।";


        showAlert(
          title,
          message
        );


        /*
        Browser notification
        */

        if (
          Notification.permission ===
          "granted"
        ) {

          try {

            new Notification(
              title,
              {
                body: message
              }
            );

          }

          catch (error) {

            console.log(
              "Notification display error:",
              error
            );

          }

        }

      }
    );



    /*
    =====================================================
    SHOW ALERT
    =====================================================
    */

    function showAlert(
      title,
      message
    ) {

      const box =
        document.getElementById(
          "alertBox"
        );


      document.getElementById(
        "alertTitle"
      ).textContent =
        title;


      document.getElementById(
        "alertMessage"
      ).textContent =
        message;


      box.style.display =
        "block";

    }



    /*
    =====================================================
    CHANGE DISTRICT
    =====================================================
    */

    async function changeDistrict() {

      const newDistrict =
        prompt(
          "নতুন জেলা লিখুন:\n\n" +
          districts.join(" • ")
        );


      if (!newDistrict) {

        return;

      }


      if (
        !districts.includes(
          newDistrict.trim()
        )
      ) {

        alert(
          "সঠিক জেলার নাম লিখুন।"
        );

        return;

      }


      const district =
        newDistrict.trim();


      localStorage.setItem(
        "userDistrict",
        district
      );


      document.getElementById(
        "selectedDistrict"
      ).textContent =
        district;


      try {

        const user =
          await loginAnonymously();


        const token =
          localStorage.getItem(
            "fcmToken"
          );


        if (token) {

          await saveUserToFirestore(
            user,
            district,
            token
          );

        }


        document.getElementById(
          "status"
        ).className =
          "status success";


        document.getElementById(
          "status"
        ).innerHTML =
          "✅ জেলা পরিবর্তন হয়েছে।<br>" +
          "নতুন জেলার জন্য notification registration updated হয়েছে।";

      }

      catch (error) {

        console.error(
          error
        );

        document.getElementById(
          "status"
        ).className =
          "status error";


        document.getElementById(
          "status"
        ).textContent =
          "জেলা পরিবর্তন হয়েছে, কিন্তু database update করতে সমস্যা হয়েছে।";

      }

    }



    /*
    =====================================================
    ESCAPE HTML
    =====================================================
    */

    function escapeHtml(
      text
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text;


      return div.innerHTML;

    }



    /*
    =====================================================
    PAGE LOAD
    =====================================================
    */

    window.addEventListener(
      "load",
      async () => {

        const savedDistrict =
          localStorage.getItem(
            "userDistrict"
          );


        if (!savedDistrict) {

          return;

        }


        document.getElementById(
          "setup"
        ).style.display =
          "none";


        document.getElementById(
          "home"
        ).style.display =
          "block";


        document.getElementById(
          "selectedDistrict"
        ).textContent =
          savedDistrict;


        /*
        If notification permission
        already exists, refresh registration.
        */

        if (
          "Notification" in window &&
          Notification.permission ===
          "granted"
        ) {

          try {

            await setupNotifications(
              savedDistrict
            );

          }

          catch (error) {

            console.error(
              "Automatic setup error:",
              error
            );

            document.getElementById(
              "status"
            ).className =
              "status error";


            document.getElementById(
              "status"
            ).innerHTML =
              "❌ Notification setup করতে সমস্যা হয়েছে।<br>" +
              "<small>" +
              escapeHtml(
                error.message ||
                "Unknown error"
              ) +
              "</small>";

          }

        }

        else {

          document.getElementById(
            "status"
          ).className =
            "status warning";


          document.getElementById(
            "status"
          ).textContent =
            "🔕 Notification permission দেওয়া হয়নি।";

        }

      }
    );

  </script>

</body>

</html>
